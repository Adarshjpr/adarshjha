<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics with AI</title>
<style>
.cardShad{background:#fff;border-radius:22px;box-shadow:0 20px 40px rgba(0,0,0,.1);width:100%;max-width:380px;padding:16px 16px 14px}
.badge{display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(90deg,#ff5421,#ff6b3d);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;padding:5px 12px;border-radius:50px;width:fit-content;margin:0 auto 12px}
.title{text-align:center;font-size:20px;font-weight:800;color:#111;line-height:1.25;margin-bottom:2px}
.title span{color:#ff5421}
.sub{text-align:center;font-size:12px;color:#6b7280;margin-bottom:14px}

/* ===== Pricing - Equal & Close ===== */
.pricing{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.old, .now{
  flex:1;
  border-radius:12px;
  padding:10px 8px;
  text-align:center;
}
.old{
  background:#f9fafb;
  border:1.5px solid #e5e7eb;
}
.old .l{font-size:11px;color:#6b7280;margin-bottom:2px}
.old .v{font-size:16px;font-weight:600;color:#9ca3af;text-decoration:line-through}
.old .g{font-size:10px;color:#9ca3af;margin-top:1px}
.now{
  background:linear-gradient(135deg,#ff5421,#ff6b3d);
  box-shadow:0 6px 16px rgba(255,84,33,.3);
}
.now .l{font-size:11px;color:rgba(255,255,255,.95);margin-bottom:2px}
.now .v{font-size:18px;font-weight:800;color:#fff;line-height:1.1}
.now .g{font-size:10px;color:rgba(255,255,255,.9);margin-top:1px}

.feats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.f{border-radius:12px;padding:8px 6px;text-align:center;border:1.5px solid;display:flex;flex-direction:column;align-items:center;gap:4px}
.f.p{background:#faf5ff;border-color:#e9d5ff}
.f.g{background:#f0fdf4;border-color:#bbf7d0}
.f.o{background:#fff7ed;border-color:#fed7aa}
.f .i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.f.p .i{background:#f3e8ff;color:#9333ea}
.f.g .i{background:#dcfce7;color:#16a34a}
.f.o .i{background:#ffedd5;color:#ff5421}
.f .t{font-size:10.5px;font-weight:700;color:#1f2937;line-height:1.2}
.f .d{font-size:9.5px;color:#6b7280;line-height:1.25}
.form{border-top:1px solid #f3f4f6;padding-top:12px}
.fh{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:14px;font-weight:700;color:#111}
.fh svg{width:16px;height:16px;color:#ff5421}
.row{display:flex;gap:8px;margin-bottom:8px}
.ig{position:relative;flex:1}
.ig input{width:100%;padding:11px 10px 11px 36px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13px;outline:none}
.ig input:focus{border-color:#ff5421;box-shadow:0 0 0 3px rgba(255,84,33,.12)}
.ig .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9ca3af}
.ig .ic svg{width:15px;height:15px}
.btn{width:100%;background:linear-gradient(135deg,#ff5421,#ff6b3d);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 10px;box-shadow:0 8px 18px rgba(255,84,33,.28)}
.sec{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#9ca3af}
@media(max-width:360px){.title{font-size:18px}.feats{gap:5px}}
</style>
</head>
<body>
<div class="cardShad">
  <div class="badge">⚡ LIMITED TIME OFFER</div>
  <h1 class="title">Special Offer: Data<br>Analytics with <span>AI</span></h1>
  <p class="sub">(For Limited Seats Only)</p>

  <!-- Equal & Close Pricing Buttons -->
  <div class="pricing">
    <div class="old">
      <div class="l">Old Price:</div>
      <div class="v">₹50,000</div>
      <div class="g">+GST</div>
    </div>
    <div class="now">
      <div class="l">Now Pay Only</div>
      <div class="v">₹17,500/-</div>
      <div class="g">+GST</div>
    </div>
  </div>

  <div class="feats">
    <div class="f p">
      <div class="i"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div class="t">Risk-Free Trial</div>
      <div class="d">Attend 2 Classes</div>
    </div>
    <div class="f g">
      <div class="i"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div class="t">No Hidden Charges</div>
      <div class="d">100% Transparent</div>
    </div>
    <div class="f o">
      <div class="i"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
      <div class="t">EMI AVAILABLE</div>
      <div class="d">Starts at ₹4,032/M</div>
    </div>
  </div>

  <div class="form">
    <div class="fh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Fill Your Details
    </div>
    <form onsubmit="event.preventDefault();alert('Thank you! We will contact you soon.');this.reset()">
      <div class="row">
        <div class="ig">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" placeholder="Name" required>
        </div>
        <div class="ig">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <input type="tel" placeholder="Mobile" required>
        </div>
      </div>
      <div class="row">
        <div class="ig" style="flex:1">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <input type="tel" placeholder="Mobile Number" required>
        </div>
      </div>
      <button class="btn">Book Now →</button>
    </form>
    <div class="sec">🔒 Your information is safe and secure.</div>
  </div>
</div>
</body>
</html>
